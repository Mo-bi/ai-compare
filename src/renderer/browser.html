<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Compare 浏览器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      background: #f5f5f5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      gap: 8px;
      height: 52px;
      flex-shrink: 0;
    }

    .nav-btn {
      padding: 8px 10px;
      border: none;
      background: #f0f0f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: #e0e0e0;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .url-bar {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      padding: 8px 12px;
    }

    .url-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 13px;
      outline: none;
      padding: 4px;
      width: 100%;
    }

    .go-btn {
      padding: 4px 8px;
      border: none;
      background: transparent;
      color: #1976d2;
      cursor: pointer;
      font-size: 16px;
    }

    .webview-container {
      flex: 1;
      display: flex;
      position: relative;
    }

    webview {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      display: flex;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="nav-btn" id="back-btn" disabled>←</button>
    <button class="nav-btn" id="forward-btn" disabled>→</button>
    <button class="nav-btn" id="refresh-btn">↻</button>
    <div class="url-bar">
      <input type="text" class="url-input" id="url-input" placeholder="输入网址..." />
      <button class="go-btn" id="go-btn">→</button>
    </div>
  </div>
  <div class="webview-container">
    <webview id="browser-webview" webpreferences="contextIsolation=no, spellcheck=yes" plugins="true"></webview>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const urlInput = document.getElementById('url-input')
    const goBtn = document.getElementById('go-btn')
    const backBtn = document.getElementById('back-btn')
    const forwardBtn = document.getElementById('forward-btn')
    const refreshBtn = document.getElementById('refresh-btn')
    const webview = document.getElementById('browser-webview')

    // 当前要加载的 URL（通过 query string 传递）
    const params = new URLSearchParams(window.location.search)
    const initialUrl = params.get('url') || 'https://www.google.com'

    // 加载 URL
    function loadUrl(url) {
      if (!url) return
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url
      }
      webview.src = url
      urlInput.value = url
    }

    // 点击 Go 按钮
    goBtn.addEventListener('click', () => {
      loadUrl(urlInput.value)
    })

    // 输入框回车
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        loadUrl(urlInput.value)
      }
    })

    // 导航按钮
    backBtn.addEventListener('click', () => webview.goBack())
    forwardBtn.addEventListener('click', () => webview.goForward())
    refreshBtn.addEventListener('click', () => webview.reload())

    // 监听 webview 事件更新 UI
    webview.addEventListener('did-stop-loading', () => {
      urlInput.value = webview.getURL()
      document.title = webview.getTitle() || 'AI Compare 浏览器'
    })

    webview.addEventListener('did-navigate', () => {
      backBtn.disabled = !webview.canGoBack()
      forwardBtn.disabled = !webview.canGoForward()
      urlInput.value = webview.getURL()
    })

    webview.addEventListener('did-navigate-in-page', () => {
      urlInput.value = webview.getURL()
    })

    webview.addEventListener('new-window', (e) => {
      e.preventDefault()
      ipcRenderer.send('open-new-window', e.url)
    })

    // 页面加载完成后加载初始 URL
    loadUrl(initialUrl)
  </script>
</body>
</html>
